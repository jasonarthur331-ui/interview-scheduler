<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interview Availability</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      padding: 40px;
    }
    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      background: #1a73e8;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Interview Availability</h2>
    <p>Please let us know when you are available for interview.</p>

   <form name="interview-availability"
      method="POST"
      data-netlify="true"
      action="/?submitted=true">

        

      <input type="hidden" name="form-name" value="interview-availability">

      <label>
        Full name
        <input type="text" name="name" required>
      </label>

      <label>
        Email address
        <input type="email" name="email" required>
      </label>

      <label>
        Your availability
        <textarea name="availability" required
          placeholder="e.g. Mon–Wed 10:00–14:00 GMT"></textarea>
      </label>

      <label>
        Timezone
        <select name="timezone" required>
          <option value="">Select</option>
          <option>GMT</option>
          <option>GMT+1</option>
          <option>GMT-5</option>
        </select>
      </label>

      <label>
        <input type="checkbox" name="consent" required>
        I consent to my data being used for interview scheduling
      </label>

      <button type="submit">Submit availability</button>
    </form>
  </div>

</body>
</html>
