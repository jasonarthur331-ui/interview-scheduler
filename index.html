<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Candidate Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --primary:#2563eb;
      --banner:#b7c84b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: var(--text);
    }

    /* Banner */
    .banner {
      background: var(--banner);
      color: #fff;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,.25);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .banner-title {
      font-size: 18px;
      font-weight: 800;
    }

    .banner-sub {
      font-size: 13px;
      opacity: .9;
    }

    .wrap {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,.06);
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
    }

    .underline {
      width: 48px;
      height: 4px;
      background: var(--primary);
      border-radius: 999px;
      margin: 10px 0 18px;
    }

    .subtext {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
    }

    input {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37,99,235,.12);
    }

    .help {
      font-size: 12px;
      color: var(--muted);
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #3b82f6, #7c3aed);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header class="banner">
  <div class="logo">ATS</div>
  <div>
    <div class="banner-title">Interview Scheduling</div>
    <div class="banner-sub">Availability confirmation</div>
  </div>
</header>

<main class="wrap">
  <section class="card">

    <h1>Interview Availability</h1>
    <div class="underline"></div>
    <p class="subtext">
      Please register your details so we can confirm your interview.
    </p>

    <!-- ✅ CORRECT FORMSPREE ENDPOINT -->
    <form method="POST" action="https://formspree.io/f/mykyawdj">

      <input type="hidden" name="_subject" value="New Candidate Registration">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_redirect" value="/thanks.html">

      <div class="grid">

        <div class="field">
          <label>First Name</label>
          <input type="text" name="first_name" required>
        </div>

        <div class="field">
          <label>Surname</label>
          <input type="text" name="surname" required>
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>

        <div class="field">
          <label>Phone Number</label>
          <input type="tel" name="phone" required>
        </div>

        <div class="field">
          <label>Memorable word</label>
          <input type="password"
                 id="mw"
                 name="memorable_word"
                 placeholder="Minimum 8 characters, 1 special character"
                 minlength="8"
                 required>
          <div class="help">
            Used only to verify your identity during scheduling.
          </div>
        </div>

        <div class="field">
          <label>Confirm memorable word</label>
          <input type="password"
                 id="cmw"
                 placeholder="Must match"
                 required>
        </div>

      </div>

      <button type="submit">Register</button>

    </form>

  </section>
</main>

<script>
  const mw = document.getElementById('mw');
  const cmw = document.getElementById('cmw');

  document.querySelector('form').addEventListener('submit', function(e) {
    if (mw.value !== cmw.value) {
      e.preventDefault();
      alert('Memorable words do not match');
    }
  });
</script>

</body>
</html>
