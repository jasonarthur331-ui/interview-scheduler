<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Candidate Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --primary:#2563eb;
      --banner:#b7c84b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: var(--text);
    }

    /* Banner */
    .banner {
      background: var(--banner);
      color: #fff;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,.25);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .banner-title {
      font-size: 18px;
      font-weight: 800;
    }

    .banner-sub {
      font-size: 13px;
      opacity: .9;
    }

    /* Layout */
    .wrap {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,.06);
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
    }

    .underline {
      width: 48px;
      height: 4px;
      background: var(--primary);
      border-radius: 999px;
      margin: 10px 0 18px;
    }

    .subtext {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 22px;
    }

    /* Form */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .full { grid-column: 1 / -1; }

    label {
      font-size: 13px;
      font-weight: 700;
    }

    input, select {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37,99,235,.12);
    }

    .help {
      font-size: 12px;
      color: var(--muted);
    }

    /* Slots */
    .slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 720px) {
      .slots { grid-template-columns: 1fr; }
    }

    .slot-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .slot-title {
      font-weight: 800;
      margin-bottom: 8px;
    }

    .slot-card label {
      display: flex;
      gap: 10px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 6px;
    }

    .slot-card input {
      width: auto;
    }

    /* Consent */
    .consent {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .consent input {
      width: auto;
      margin-top: 3px;
    }

    /* Submit */
    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #3b82f6, #7c3aed);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header class="banner">
  <div class="logo">ATS</div>
  <div>
    <div class="banner-title">Interview Scheduling</div>
    <div class="banner-sub">Availability confirmation</div>
  </div>
</header>

<main class="wrap">
  <section class="card">

    <h1>Interview Availability</h1>
    <div class="underline"></div>
    <p class="subtext">
      Please register your details and select all interview times you are available for.
    </p>

    <form name="interview-availability"
          method="POST"
          data-netlify="true"
          action="/?submitted=true">

      <input type="hidden" name="form-name" value="interview-availability">
      <input type="hidden" id="slot_check" name="slot_check">

      <div class="grid">

        <div class="field">
          <label>First Name</label>
          <input type="text" name="first_name" required>
        </div>

        <div class="field">
          <label>Surname</label>
          <input type="text" name="surname" required>
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>

        <div class="field">
          <label>Phone Number</label>
          <input type="tel" name="phone" required>
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" id="mw" name="memorable_word" required>
        </div>

        <div class="field">
          <label>Confirm Password</label>
          <input type="password" id="cmw" required>
        </div>

   


      <button type="submit">Register</button>

    </form>

  </section>
</main>

<script>
  const mw = document.getElementById('mw');
  const cmw = document.getElementById('cmw');
  const slots = document.querySelectorAll('.slot');
  const slotCheck = document.getElementById('slot_check');

  function validateForm(e) {
    if (mw.value !== cmw.value) {
      e.preventDefault();
      alert('Memorable words do not match');
      return;
    }

    const anySlot = Array.from(slots).some(s => s.checked);
    if (!anySlot) {
      e.preventDefault();
      alert('Please select at least one interview slot');
      return;
    }

    slotCheck.value = 'selected';
  }

  document.querySelector('form').addEventListener('submit', validateForm);
</script>

</body>
</html>
